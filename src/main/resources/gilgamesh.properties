# Gilgamesh settings (these are the defaults).
#
# To change a setting, copy this file to one of these places and edit it:
#   1. a path passed on the command line:  --config my.properties
#   2. gilgamesh.properties in the folder you start the bot from
#   3. ~/.gilgamesh/gilgamesh.properties
# The first one found wins. You only need to list the settings you change.
# After changing a classifier setting, run the tests and read the "EVAL" lines
# to see whether accuracy went up or down.

# --- Intent classifier ---

# Minimum score (0-1) for an intent to count as understood. Lower = answers more
# often but guesses wrong more; higher = says "I don't understand" more often.
classifier.threshold=0.40

# Score multiplier for intents that continue the current topic (1.0 = off).
classifier.contextBoost=1.25

# How the two similarity measures are mixed (normalised to sum to 1).
classifier.overlapWeight=0.4
classifier.cosineWeight=0.6

# --- Conversation ---

# Ask "did you mean X or Y?" when the top two intents score within this
# fraction of each other. -1 turns the question off.
conversation.ambiguityMargin=0.05

# --- Memory ---

# How many recent turns are kept as history.
memory.historySize=10

# Forget the conversation after this many turns (0 = never).
memory.maxSessionTurns=0

# Forget the conversation after this many idle minutes (0 = never).
memory.inactivityTimeoutMinutes=5

# --- Saved session ---

# Where the conversation is saved between runs. Empty = ~/.gilgamesh/session.json
# Use forward slashes, also on Windows:  session.path=C:/Users/me/gilgamesh/session.json
session.path=

# A saved conversation older than this many hours is not restored (0 = always restore).
session.maxAgeHours=24

# --- Web server (only used when started with --serve) ---

# Address to listen on. 127.0.0.1 = only this computer can reach the bot.
# Use 0.0.0.0 to let other devices on your network connect; there is no login,
# so do that only on a network you trust.
server.host=127.0.0.1

# Port to listen on (also settable with --port).
server.port=7070

# How many conversations are kept in memory at once. Older ones are saved to disk
# and reloaded when their user comes back.
server.maxSessions=200

# Longest message accepted, in characters.
server.maxMessageLength=500
